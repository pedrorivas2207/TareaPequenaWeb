<!DOCTYPE html>
<html>
<head>
    <title>Torneos</title>
</head>
<body>

    <h1>Torneos disponibles</h1>

    {% for torneo in torneos %}
        <h2>{{ torneo.nombre }}</h2>
        <p>Fecha de inicio: {{ torneo.fecha_inicio }}</p>
        <p>Premio: {{ torneo.premio }}</p>
        <hr>
    {% endfor %}

</body>
</html>
