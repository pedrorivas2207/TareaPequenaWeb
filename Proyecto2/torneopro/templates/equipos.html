<!DOCTYPE html>
<html>
<head>
    <title>Equipos</title>
</head>
<body>

    <h1>Equipos del torneo</h1>

    {% for equipo in equipos %}
        <h2>{{ equipo.nombre }}</h2>
        <p>Ciudad: {{ equipo.ciudad }}</p>
        <p>Entrenador: {{ equipo.entrenador }}</p>
        <hr>
    {% endfor %}

</body>
</html>
